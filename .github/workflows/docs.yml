# Publishes /docs to GitHub Pages.
#
# `enablement: true` below asks GitHub to switch Pages on by itself. Whether
# that is allowed depends on the repository: the workflow token often cannot
# create a Pages site, and the step then fails with
#
#     Create Pages site failed. Resource not accessible by integration
#
# which is what happens on this repository. When you see that, switch it on by
# hand once — Settings -> Pages -> Source: "GitHub Actions" — and every run
# after that works. The setting is left in because it costs nothing and saves
# the manual step wherever it is permitted.
name: Documentation

on:
  push:
    branches: [master, main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer one win rather than queueing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
